<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="GitHub statistics for Chinnadurai S U">
  <title>GitHub Stats — Chinnadurai S U</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#0B1226"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#EC4899"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .lbl{fill:#94A3B8;font-size:13px}
      .val{fill:#E2E8F0;font-size:14px;font-weight:700;font-family:'SFMono-Regular',Consolas,monospace}
      .row{opacity:0;animation:fadein .6s ease-out forwards}
      @keyframes fadein{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
    </style>
  </defs>

  <rect width="500" height="220" rx="16" fill="url(#bg)" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect width="500" height="220" rx="16" fill="#ffffff" fill-opacity="0.02"/>
  <text x="24" y="36" fill="url(#brand)" font-size="18" font-weight="800" filter="url(#g)">Chinnadurai's GitHub Stats</text>
  <line x1="24" y1="48" x2="330" y2="48" stroke="#8B5CF6" stroke-opacity="0.3"/>

  <!-- stat rows with sliding progress bars -->
  <g>
    <g class="row" style="animation-delay:.1s"><text x="24" y="82" class="lbl">⭐ Total Stars</text><text x="300" y="82" text-anchor="end" class="val">340</text>
      <rect x="24" y="90" width="276" height="4" rx="2" fill="#1E293B"/><rect x="24" y="90" width="0" height="4" rx="2" fill="url(#bar)"><animate attributeName="width" values="0;220" dur="1.4s" begin=".3s" fill="freeze"/></rect></g>
    <g class="row" style="animation-delay:.25s"><text x="24" y="112" class="lbl">🔥 Total Commits (2026)</text><text x="300" y="112" text-anchor="end" class="val">2,140</text>
      <rect x="24" y="120" width="276" height="4" rx="2" fill="#1E293B"/><rect x="24" y="120" width="0" height="4" rx="2" fill="url(#bar)"><animate attributeName="width" values="0;250" dur="1.4s" begin=".4s" fill="freeze"/></rect></g>
    <g class="row" style="animation-delay:.4s"><text x="24" y="142" class="lbl">🔀 Total PRs</text><text x="300" y="142" text-anchor="end" class="val">180</text>
      <rect x="24" y="150" width="276" height="4" rx="2" fill="#1E293B"/><rect x="24" y="150" width="0" height="4" rx="2" fill="url(#bar)"><animate attributeName="width" values="0;170" dur="1.4s" begin=".5s" fill="freeze"/></rect></g>
    <g class="row" style="animation-delay:.55s"><text x="24" y="172" class="lbl">🐛 Total Issues</text><text x="300" y="172" text-anchor="end" class="val">95</text>
      <rect x="24" y="180" width="276" height="4" rx="2" fill="#1E293B"/><rect x="24" y="180" width="0" height="4" rx="2" fill="url(#bar)"><animate attributeName="width" values="0;120" dur="1.4s" begin=".6s" fill="freeze"/></rect></g>
    <g class="row" style="animation-delay:.7s"><text x="24" y="202" class="lbl">📦 Contributed (last year)</text><text x="300" y="202" text-anchor="end" class="val">48</text>
      <rect x="24" y="208" width="276" height="4" rx="2" fill="#1E293B"/><rect x="24" y="208" width="0" height="4" rx="2" fill="url(#bar)"><animate attributeName="width" values="0;90" dur="1.4s" begin=".7s" fill="freeze"/></rect></g>
  </g>

  <!-- circular rank -->
  <g transform="translate(410,110)">
    <circle r="58" fill="none" stroke="#1E293B" stroke-width="8"/>
    <circle r="58" fill="none" stroke="url(#brand)" stroke-width="8" stroke-linecap="round" transform="rotate(-90)" stroke-dasharray="365" stroke-dashoffset="365" filter="url(#g)">
      <animate attributeName="stroke-dashoffset" values="365;60" dur="1.8s" begin=".4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    </circle>
    <text y="6" text-anchor="middle" fill="#F8FAFC" font-size="34" font-weight="800">A+</text>
    <text y="30" text-anchor="middle" fill="#94A3B8" font-size="11">Rank</text>
  </g>
</svg>
