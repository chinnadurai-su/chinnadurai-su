<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Achievement trophies for Chinnadurai S U">
  <title>Trophies — Chinnadurai S U</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#0B1226"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#EC4899"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FDE68A"/><stop offset="100%" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity="0.35"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <g id="cup">
      <path d="M-14 -16 h28 v6 a14 14 0 0 1 -28 0 Z" fill="url(#gold)"/>
      <path d="M-18 -14 a6 6 0 0 0 6 8 M18 -14 a6 6 0 0 1 -6 8" fill="none" stroke="url(#gold)" stroke-width="3"/>
      <rect x="-4" y="-2" width="8" height="8" fill="url(#gold)"/>
      <rect x="-10" y="6" width="20" height="4" rx="2" fill="url(#gold)"/>
    </g>
  </defs>

  <rect width="860" height="200" rx="16" fill="url(#bg)" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="24" y="34" fill="url(#brand)" font-size="18" font-weight="800" filter="url(#g)">🏆 Achievement Showcase</text>
  <line x1="24" y1="46" x2="300" y2="46" stroke="#8B5CF6" stroke-opacity="0.3"/>

  <!-- CARD template repeated; each pops in + shine sweep -->
  <!-- card 1 -->
  <g transform="translate(85,120)">
    <g transform="scale(0)"><animateTransform attributeName="transform" type="scale" values="0;1.12;1" keyTimes="0;0.7;1" dur=".6s" begin="0.1s" fill="freeze"/>
      <rect x="-60" y="-52" width="120" height="104" rx="14" fill="#111a2e" stroke="#8B5CF6" stroke-opacity="0.5"/>
      <g transform="translate(0,-18)"><use href="#cup" filter="url(#g)"/></g>
      <text y="14" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="800">S</text>
      <text y="32" text-anchor="middle" fill="#94A3B8" font-size="10">Commits</text>
      <clipPath id="c1"><rect x="-60" y="-52" width="120" height="104" rx="14"/></clipPath>
      <g clip-path="url(#c1)"><rect x="-120" y="-52" width="40" height="104" fill="url(#shine)" transform="skewX(-20)"><animate attributeName="x" values="-120;120" dur="2.5s" begin="0.8s" repeatCount="indefinite"/></rect></g>
    </g>
  </g>
  <!-- card 2 -->
  <g transform="translate(215,120)">
    <g transform="scale(0)"><animateTransform attributeName="transform" type="scale" values="0;1.12;1" keyTimes="0;0.7;1" dur=".6s" begin="0.2s" fill="freeze"/>
      <rect x="-60" y="-52" width="120" height="104" rx="14" fill="#111a2e" stroke="#EC4899" stroke-opacity="0.5"/>
      <g transform="translate(0,-18)"><use href="#cup" filter="url(#g)"/></g>
      <text y="14" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="800">A+</text>
      <text y="32" text-anchor="middle" fill="#94A3B8" font-size="10">Stars</text>
      <clipPath id="c2"><rect x="-60" y="-52" width="120" height="104" rx="14"/></clipPath>
      <g clip-path="url(#c2)"><rect x="-120" y="-52" width="40" height="104" fill="url(#shine)" transform="skewX(-20)"><animate attributeName="x" values="-120;120" dur="2.5s" begin="1.1s" repeatCount="indefinite"/></rect></g>
    </g>
  </g>
  <!-- card 3 -->
  <g transform="translate(345,120)">
    <g transform="scale(0)"><animateTransform attributeName="transform" type="scale" values="0;1.12;1" keyTimes="0;0.7;1" dur=".6s" begin="0.3s" fill="freeze"/>
      <rect x="-60" y="-52" width="120" height="104" rx="14" fill="#111a2e" stroke="#38BDF8" stroke-opacity="0.5"/>
      <g transform="translate(0,-18)"><use href="#cup" filter="url(#g)"/></g>
      <text y="14" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="800">A</text>
      <text y="32" text-anchor="middle" fill="#94A3B8" font-size="10">Pull Requests</text>
      <clipPath id="c3"><rect x="-60" y="-52" width="120" height="104" rx="14"/></clipPath>
      <g clip-path="url(#c3)"><rect x="-120" y="-52" width="40" height="104" fill="url(#shine)" transform="skewX(-20)"><animate attributeName="x" values="-120;120" dur="2.5s" begin="1.4s" repeatCount="indefinite"/></rect></g>
    </g>
  </g>
  <!-- card 4 -->
  <g transform="translate(475,120)">
    <g transform="scale(0)"><animateTransform attributeName="transform" type="scale" values="0;1.12;1" keyTimes="0;0.7;1" dur=".6s" begin="0.4s" fill="freeze"/>
      <rect x="-60" y="-52" width="120" height="104" rx="14" fill="#111a2e" stroke="#8B5CF6" stroke-opacity="0.5"/>
      <g transform="translate(0,-18)"><use href="#cup" filter="url(#g)"/></g>
      <text y="14" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="800">A</text>
      <text y="32" text-anchor="middle" fill="#94A3B8" font-size="10">Issues</text>
      <clipPath id="c4"><rect x="-60" y="-52" width="120" height="104" rx="14"/></clipPath>
      <g clip-path="url(#c4)"><rect x="-120" y="-52" width="40" height="104" fill="url(#shine)" transform="skewX(-20)"><animate attributeName="x" values="-120;120" dur="2.5s" begin="1.7s" repeatCount="indefinite"/></rect></g>
    </g>
  </g>
  <!-- card 5 -->
  <g transform="translate(605,120)">
    <g transform="scale(0)"><animateTransform attributeName="transform" type="scale" values="0;1.12;1" keyTimes="0;0.7;1" dur=".6s" begin="0.5s" fill="freeze"/>
      <rect x="-60" y="-52" width="120" height="104" rx="14" fill="#111a2e" stroke="#EC4899" stroke-opacity="0.5"/>
      <g transform="translate(0,-18)"><use href="#cup" filter="url(#g)"/></g>
      <text y="14" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="800">B+</text>
      <text y="32" text-anchor="middle" fill="#94A3B8" font-size="10">Followers</text>
      <clipPath id="c5"><rect x="-60" y="-52" width="120" height="104" rx="14"/></clipPath>
      <g clip-path="url(#c5)"><rect x="-120" y="-52" width="40" height="104" fill="url(#shine)" transform="skewX(-20)"><animate attributeName="x" values="-120;120" dur="2.5s" begin="2s" repeatCount="indefinite"/></rect></g>
    </g>
  </g>
  <!-- card 6 -->
  <g transform="translate(735,120)">
    <g transform="scale(0)"><animateTransform attributeName="transform" type="scale" values="0;1.12;1" keyTimes="0;0.7;1" dur=".6s" begin="0.6s" fill="freeze"/>
      <rect x="-60" y="-52" width="120" height="104" rx="14" fill="#111a2e" stroke="#38BDF8" stroke-opacity="0.5"/>
      <g transform="translate(0,-18)"><use href="#cup" filter="url(#g)"/></g>
      <text y="14" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="800">S</text>
      <text y="32" text-anchor="middle" fill="#94A3B8" font-size="10">Repositories</text>
      <clipPath id="c6"><rect x="-60" y="-52" width="120" height="104" rx="14"/></clipPath>
      <g clip-path="url(#c6)"><rect x="-120" y="-52" width="40" height="104" fill="url(#shine)" transform="skewX(-20)"><animate attributeName="x" values="-120;120" dur="2.5s" begin="2.3s" repeatCount="indefinite"/></rect></g>
    </g>
  </g>
</svg>
