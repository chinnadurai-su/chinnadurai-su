<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 600" width="420" height="600" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Chinnadurai S U — developer ID lanyard">
  <title>Chinnadurai S U — ID Lanyard</title>
  <defs>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DB2777"/><stop offset="50%" stop-color="#EC4899"/><stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0B1226"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EC4899"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5E7EB"/><stop offset="45%" stop-color="#9CA3AF"/><stop offset="55%" stop-color="#6B7280"/><stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lanAvatar"><circle cx="210" cy="300" r="46"/></clipPath>
    <filter id="lanGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="420" height="600" fill="#0F172A"/>
  <circle cx="210" cy="320" r="180" fill="url(#cardGlow)"/>

  <!-- top mount -->
  <rect x="150" y="8" width="120" height="10" rx="5" fill="#334155"/>
  <circle cx="210" cy="13" r="4" fill="#64748B"/>

  <!-- SWINGING GROUP: pendulum around (210,16) -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-7 210 16; 7 210 16; -7 210 16"
      keyTimes="0;0.5;1"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
      calcMode="spline" dur="4.5s" repeatCount="indefinite"/>

    <!-- straps (two sides meeting) -->
    <path d="M204 16 L150 210 H176 L210 40 Z" fill="url(#strap)"/>
    <path d="M216 16 L270 210 H244 L210 40 Z" fill="url(#strap)"/>
    <rect x="150" y="206" width="120" height="14" rx="4" fill="#9D174D"/>
    <!-- brand text on strap -->
    <text x="210" y="140" text-anchor="middle" fill="#FBCFE8" font-size="11" font-weight="700" letter-spacing="3" transform="rotate(0)">DEVELOPER</text>

    <!-- metal hook -->
    <rect x="200" y="216" width="20" height="20" rx="4" fill="url(#metal)"/>
    <circle cx="210" cy="240" r="10" fill="none" stroke="url(#metal)" stroke-width="5"/>

    <!-- ID CARD -->
    <g filter="url(#lanGlow)">
      <rect x="90" y="250" width="240" height="330" rx="22" fill="url(#cardBg)" stroke="url(#brand)" stroke-width="2"/>
    </g>
    <rect x="90" y="250" width="240" height="330" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    <!-- card hole -->
    <rect x="192" y="262" width="36" height="9" rx="4.5" fill="#0B1226" stroke="#334155"/>

    <!-- top brand bar -->
    <rect x="90" y="284" width="240" height="4" fill="url(#brand)"/>

    <!-- avatar ring + placeholder -->
    <circle cx="210" cy="300" r="50" fill="none" stroke="url(#brand)" stroke-width="3">
      <animate attributeName="stroke-dasharray" values="0 320;320 0" dur="2.5s" fill="freeze"/>
    </circle>
    <g clip-path="url(#lanAvatar)">
      <rect x="164" y="254" width="92" height="92" fill="#1E293B"/>
      <circle cx="210" cy="292" r="18" fill="#8B5CF6" opacity="0.85"/>
      <path d="M182 340 q28 -36 56 0 Z" fill="#8B5CF6" opacity="0.85"/>
      <!-- Replace with: <image href="data:image/png;base64,XXXX" x="164" y="254" width="92" height="92"/> -->
    </g>

    <!-- name + role -->
    <text x="210" y="384" text-anchor="middle" fill="#F8FAFC" font-size="19" font-weight="800">Chinnadurai S U</text>
    <text x="210" y="404" text-anchor="middle" fill="#8B5CF6" font-size="11" font-weight="600" letter-spacing="0.5">Angular • TypeScript • Node.js</text>
    <text x="210" y="420" text-anchor="middle" fill="#94A3B8" font-size="10">Senior Associate Projects @ Cognizant</text>

    <!-- tech chips -->
    <g font-size="9" font-weight="700" text-anchor="middle">
      <rect x="118" y="432" width="56" height="20" rx="10" fill="#DD0031" fill-opacity="0.25" stroke="#DD0031" stroke-opacity="0.6"/><text x="146" y="446" fill="#FCA5A5">Angular</text>
      <rect x="182" y="432" width="56" height="20" rx="10" fill="#3178C6" fill-opacity="0.25" stroke="#3178C6" stroke-opacity="0.6"/><text x="210" y="446" fill="#93C5FD">TypeScript</text>
      <rect x="246" y="432" width="56" height="20" rx="10" fill="#3C873A" fill-opacity="0.3" stroke="#6CC24A" stroke-opacity="0.7"/><text x="274" y="446" fill="#86EFAC">Node.js</text>
    </g>

    <!-- QR code (decorative grid) -->
    <g transform="translate(108,468)" fill="#E2E8F0">
      <rect x="-4" y="-4" width="64" height="64" rx="6" fill="#0B1226" stroke="#334155"/>
      <rect x="0" y="0" width="16" height="16" fill="none" stroke="#E2E8F0" stroke-width="4"/>
      <rect x="40" y="0" width="16" height="16" fill="none" stroke="#E2E8F0" stroke-width="4"/>
      <rect x="0" y="40" width="16" height="16" fill="none" stroke="#E2E8F0" stroke-width="4"/>
      <rect x="24" y="4" width="4" height="4"/><rect x="30" y="4" width="4" height="4"/><rect x="24" y="10" width="4" height="4"/>
      <rect x="24" y="24" width="4" height="4"/><rect x="30" y="30" width="4" height="4"/><rect x="36" y="24" width="4" height="4"/><rect x="42" y="30" width="4" height="4"/>
      <rect x="24" y="42" width="4" height="4"/><rect x="30" y="48" width="4" height="4"/><rect x="42" y="42" width="4" height="4"/><rect x="48" y="48" width="4" height="4"/><rect x="42" y="54" width="4" height="4"/>
      <rect x="6" y="6" width="4" height="4"/><rect x="46" y="6" width="4" height="4"/><rect x="6" y="46" width="4" height="4"/>
    </g>

    <!-- barcode -->
    <g transform="translate(182,470)">
      <rect x="-4" y="-4" width="140" height="44" rx="6" fill="#0B1226" stroke="#334155"/>
      <g fill="#E2E8F0">
        <rect x="4" y="2" width="2" height="30"/><rect x="8" y="2" width="4" height="30"/><rect x="14" y="2" width="2" height="30"/>
        <rect x="18" y="2" width="6" height="30"/><rect x="26" y="2" width="2" height="30"/><rect x="30" y="2" width="4" height="30"/>
        <rect x="36" y="2" width="2" height="30"/><rect x="40" y="2" width="6" height="30"/><rect x="48" y="2" width="2" height="30"/>
        <rect x="52" y="2" width="4" height="30"/><rect x="58" y="2" width="2" height="30"/><rect x="62" y="2" width="6" height="30"/>
        <rect x="70" y="2" width="2" height="30"/><rect x="74" y="2" width="4" height="30"/><rect x="80" y="2" width="2" height="30"/>
        <rect x="84" y="2" width="6" height="30"/><rect x="92" y="2" width="2" height="30"/><rect x="96" y="2" width="4" height="30"/>
        <rect x="102" y="2" width="2" height="30"/><rect x="106" y="2" width="6" height="30"/><rect x="114" y="2" width="2" height="30"/>
        <rect x="118" y="2" width="4" height="30"/><rect x="124" y="2" width="6" height="30"/>
      </g>
      <text x="66" y="40" text-anchor="middle" fill="#64748B" font-size="8" font-family="monospace">CHINNADURAI-SU</text>
    </g>

    <!-- github handle -->
    <text x="210" y="552" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="700" font-family="monospace">@chinnadurai-su</text>
    <text x="210" y="568" text-anchor="middle" fill="#64748B" font-size="9">github.com/chinnadurai-su</text>
  </g>
</svg>
