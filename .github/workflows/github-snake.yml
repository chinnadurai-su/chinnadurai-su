name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (purple + pink)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#8B5CF6&color_dots=#1E293B,#5B21B6,#8B5CF6,#EC4899,#F9A8D4
            dist/github-snake.svg?palette=github-light&color_snake=#8B5CF6&color_dots=#EDE9FE,#C4B5FD,#8B5CF6,#EC4899,#DB2777

      - name: Push to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
