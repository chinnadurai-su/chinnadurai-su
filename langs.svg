<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Top languages and skills for Chinnadurai S U">
  <title>Top Skills — Chinnadurai S U</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#0B1226"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#EC4899"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#38BDF8"/></linearGradient>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .name{fill:#E2E8F0;font-size:13px;font-weight:600}
      .pct{fill:#94A3B8;font-size:12px;font-family:'SFMono-Regular',Consolas,monospace}
      .track{fill:#1E293B}
      .fill{filter:url(#g)}
    </style>
  </defs>
  <rect width="500" height="300" rx="16" fill="url(#bg)" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="24" y="34" fill="url(#brand)" font-size="18" font-weight="800" filter="url(#g)">Most Used Languages &amp; Skills</text>
  <line x1="24" y1="46" x2="360" y2="46" stroke="#8B5CF6" stroke-opacity="0.3"/>

  <!-- bar builder: track 300px wide starting x=150 -->
  <g>
    <!-- Angular 95 -->
    <text x="24" y="72" class="name">Angular</text><text x="476" y="72" text-anchor="end" class="pct">95%</text>
    <rect x="150" y="62" width="300" height="10" rx="5" class="track"/>
    <rect x="150" y="62" width="0" height="10" rx="5" fill="#DD0031" class="fill"><animate attributeName="width" values="0;285" dur="1.5s" begin=".1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>

    <!-- TypeScript 92 -->
    <text x="24" y="98" class="name">TypeScript</text><text x="476" y="98" text-anchor="end" class="pct">92%</text>
    <rect x="150" y="88" width="300" height="10" rx="5" class="track"/>
    <rect x="150" y="88" width="0" height="10" rx="5" fill="#3178C6" class="fill"><animate attributeName="width" values="0;276" dur="1.5s" begin=".2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>

    <!-- JavaScript 90 -->
    <text x="24" y="124" class="name">JavaScript</text><text x="476" y="124" text-anchor="end" class="pct">90%</text>
    <rect x="150" y="114" width="300" height="10" rx="5" class="track"/>
    <rect x="150" y="114" width="0" height="10" rx="5" fill="#F7DF1E" class="fill"><animate attributeName="width" values="0;270" dur="1.5s" begin=".3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>

    <!-- Node.js 85 -->
    <text x="24" y="150" class="name">Node.js</text><text x="476" y="150" text-anchor="end" class="pct">85%</text>
    <rect x="150" y="140" width="300" height="10" rx="5" class="track"/>
    <rect x="150" y="140" width="0" height="10" rx="5" fill="#6CC24A" class="fill"><animate attributeName="width" values="0;255" dur="1.5s" begin=".4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>

    <!-- RxJS 82 -->
    <text x="24" y="176" class="name">RxJS</text><text x="476" y="176" text-anchor="end" class="pct">82%</text>
    <rect x="150" y="166" width="300" height="10" rx="5" class="track"/>
    <rect x="150" y="166" width="0" height="10" rx="5" fill="#C084FC" class="fill"><animate attributeName="width" values="0;246" dur="1.5s" begin=".5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>

    <!-- NgRx 78 -->
    <text x="24" y="202" class="name">NgRx</text><text x="476" y="202" text-anchor="end" class="pct">78%</text>
    <rect x="150" y="192" width="300" height="10" rx="5" class="track"/>
    <rect x="150" y="192" width="0" height="10" rx="5" fill="#A78BFA" class="fill"><animate attributeName="width" values="0;234" dur="1.5s" begin=".6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>

    <!-- HTML 90 -->
    <text x="24" y="228" class="name">HTML</text><text x="476" y="228" text-anchor="end" class="pct">90%</text>
    <rect x="150" y="218" width="300" height="10" rx="5" class="track"/>
    <rect x="150" y="218" width="0" height="10" rx="5" fill="#E34F26" class="fill"><animate attributeName="width" values="0;270" dur="1.5s" begin=".7s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>

    <!-- CSS 88 -->
    <text x="24" y="254" class="name">CSS / SCSS</text><text x="476" y="254" text-anchor="end" class="pct">88%</text>
    <rect x="150" y="244" width="300" height="10" rx="5" class="track"/>
    <rect x="150" y="244" width="0" height="10" rx="5" fill="#2965F1" class="fill"><animate attributeName="width" values="0;264" dur="1.5s" begin=".8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>

    <!-- SQL 80 -->
    <text x="24" y="280" class="name">SQL</text><text x="476" y="280" text-anchor="end" class="pct">80%</text>
    <rect x="150" y="270" width="300" height="10" rx="5" class="track"/>
    <rect x="150" y="270" width="0" height="10" rx="5" fill="#38BDF8" class="fill"><animate attributeName="width" values="0;240" dur="1.5s" begin=".9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>
  </g>
</svg>
